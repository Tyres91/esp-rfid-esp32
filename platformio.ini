; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = generic

[common]
platform = espressif8266@2.3.2
f_cpu = 160000000L
framework = arduino
board = esp12e
build_flags = -Wl,-Teagle.flash.4m2m.ld
upload_speed = 460800
monitor_speed = 115200
lib_deps = 
	ArduinoJson@6.19.1
	esphome/AsyncTCP-esphome @ ^2.0.0
	ESPAsyncUDP
	esphome/ESPAsyncWebServer-esphome @ ^3.0.0
	AsyncMqttClient@0.9.0
	https://github.com/miguelbalboa/rfid#ea7ee3f3daafd46d0c5b8438ba41147c384a1f0d
	matjack1/Wiegand Protocol Library for Arduino - for esp-rfid@^1.1.1
	Time@1.5
	Bounce2@2.52

[env:generic]
board_build.f_cpu = ${common.f_cpu}
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
lib_deps = 
	${common.lib_deps}
	lorol/LittleFS_esp32@^1.0.6
extra_scripts = scripts/GENdeploy.py
build_flags = ${common.build_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.flash_mode = dio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^6
	esphome/ESPAsyncWebServer-esphome @ ^3.0.0
	esphome/AsyncTCP-esphome @ ^2.0.0
	marvinroger/AsyncMqttClient@^0.9.0
	miguelbalboa/MFRC522@^1.4.11
	lorol/LittleFS_esp32@^1.0.6
  paulstoffregen/Time @ ^1.6.1
  thomasfredericks/Bounce2 @ ^2.72
  matjack1/Wiegand Protocol Library for Arduino - for esp-rfid @ ^1.0.0
  plerup/espsoftwareserial @ ^6.16.1
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
build_flags = 
	-D ARDUINOJSON_USE_LONG_LONG=1
	-D ASYNCWEBSERVER_REGEX

[env:debug]
board_build.f_cpu = ${common.f_cpu}
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
lib_deps = 
	${common.lib_deps}
	lorol/LittleFS_esp32@^1.0.6
build_flags = ${common.build_flags}
	-DDEBUG
extra_scripts = scripts/DBGdeploy.py
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
